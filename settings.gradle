pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
	}
	plugins {
		id 'org.springframework.boot' version '3.5.6'
		id 'io.spring.dependency-management' version '1.1.3'
	}
}

rootProject.name = 'data-service-poc'
include 'data-service', 'device-domain', 'device-api', 'machine-domain', 'machine-api'
